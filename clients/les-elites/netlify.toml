# LES ÉLITES PUBLISHING HOUSE — own Netlify site.
# Base directory = clients/les-elites (or the repo root once moved to its own repo).
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Internal files are never served.
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/catalogue"
  to = "/catalogue.html"
  status = 200
[[redirects]]
  from = "/manuscrit"
  to = "/manuscrit.html"
  status = 200
[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Replace <project>.supabase.co with the real project host (manuscript
    # files are PUT straight to Supabase Storage from the browser).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://*.supabase.co; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
