<style>

/* ================= timeline engine =================

  const it = item(el);

    if (t < k.t0) break;

/* ================= background + per-frame ================= */
const parts = [];
{ let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 46; i++) {
    const p = el('div', 'a p' + (i % 3 === 0 ? ' b' : ''), $('#particles'));
    parts.push({ p, x: rnd() * 1920, y: rnd() * 1080, sp: 8 + rnd() * 26, ph: rnd() * 6.28, sz: .5 + rnd() * 1.2 });
  }
}
function background(t) {
  $('#grid').style.transform = `translate3d(0, ${(t * 18) % 64}px, 0)`;
  const g = $('#glowG'), b = $('#glowB');
  g.style.transform = `translate3d(${200 + Math.sin(t * .21) * 260}px, ${-300 + Math.cos(t * .17) * 140}px, 0)`;
  b.style.transform = `translate3d(${900 + Math.cos(t * .19) * 300}px, ${100 + Math.sin(t * .23) * 160}px, 0)`;
  parts.forEach((q) => {
    const y = (q.y - t * q.sp) % 1120; const yy = y < -40 ? y + 1120 : y;
    q.p.style.transform = `translate3d(${q.x + Math.sin(t * .6 + q.ph) * 30}px, ${yy}px, 0) scale(${q.sz})`;
    q.p.style.opacity = .25 + .55 * (0.5 + 0.5 * Math.sin(t * 1.3 + q.ph));
  });
}
/* Step 04 shows five screens with a caption each; at authored speed a caption
   was gone before it could be read. Real time is stretched over that section
   only: the composition keeps its authored times, the film gets longer. */
const WA = 48.9, WL = 8.3, WK = 1.35;
const warp = (r) => (r < WA ? r : r < WA + WL * WK ? WA + (r - WA) / WK : r - WL * (WK - 1));
const unwarp = (f) => (f < WA ? f : f < WA + WL ? WA + (f - WA) * WK : f + WL * (WK - 1));
function seek(real) {
  background(real);
  const t = warp(real);
  SCENES.forEach((sc) => {
    let o = 0;
    if (t >= sc.t0 && t <= sc.t1) {
      o = Math.min(1, (t - sc.t0) / sc.fin, (sc.t1 - t) / sc.fout);
      o = Math.max(0, o);
    }
    sc.el.style.opacity = o;
    sc.el.style.visibility = o > 0.001 ? 'visible' : 'hidden';
  });
  ITEMS.forEach((it) => apply(it, t));
  document.querySelectorAll('[data-seq]').forEach((e) => {
    let txt = ''; for (const [at, s] of JSON.parse(e.dataset.seq)) if (t >= at) txt = s; e.textContent = txt;
  });
  const flow = document.querySelector('.flow'); if (flow) flow.style.marginLeft = -flow.offsetWidth / 2 + 'px';
  cursor.style.visibility = curOn.some(([a, b]) => t >= a && t <= b) ? 'visible' : 'hidden';
  if (!curOn.some(([a, b]) => t >= a && t <= b)) cursor.style.opacity = 0;
}
window.FILM = { seek, DUR: unwarp(DUR), CUES: CUES.map((c) => ({ t: +unwarp(c.t).toFixed(3), kind: c.kind })).sort((a, b) => a.t - b.t) };
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {}))]);
seek(0);
