<!doctype html>
<html><head><meta charset="utf-8"><title>Estevao Tati M — Intro Film</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:auto}</style>
</head><body><canvas id="c"></canvas>
<script>
/* ESTEVAO TATI M — 90 s introduction film.
   Every frame is a pure function of time: window.frame(t) draws it.
   Authored in 1920x1080 units; SCALE=2 renders 3840x2160.
   Names, titles, URLs and the logo are drawn as exact graphic layers. */
const Q = new URLSearchParams(location.search);
const SCALE = parseFloat(Q.get('scale') || '2');
const cv = document.getElementById('c');
cv.width = 1920 * SCALE; cv.height = 1080 * SCALE;
const ctx = cv.getContext('2d');

const W = 1920, H = 1080;
const COL = { bg0: '#02040b', bg1: '#081633', white: '#f4f7ff', soft: '#b9c8e8', dim: '#7f93bd',
  blue: '#3f9bff', blueRGB: '63,155,255', ice: '#9fd0ff' };
const F = { disp: 'Orbitron', body: '"Exo 2"', mono: '"JetBrains Mono"' };

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const eexpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function keys(t, ks) { // piecewise ease-in-out between keyframes [[t, ...values]]
  if (t <= ks[0][0]) return ks[0].slice(1);
  for (let i = 0; i < ks.length - 1; i++) {
    const a = ks[i], b = ks[i + 1];
    if (t <= b[0]) { const u = eio(P(t, a[0], b[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], u)); }
  }
  return ks[ks.length - 1].slice(1);
}

// ---------- assets ----------
const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
let A = {}, TL, S, CUE = {}, EVENTS = [];
const cue = (sc, i) => CUE[sc][i].at;
const cueEnd = (sc, i) => CUE[sc][i].at + CUE[sc][i].dur;

// ---------- drawing helpers ----------
function txt(s, x, y, o) {
  ctx.save();
  ctx.font = `${o.w || 400} ${o.s}px ${o.f || F.body}`;
  const ls = o.ls || 0; ctx.letterSpacing = ls + 'px';
  ctx.fillStyle = o.c || COL.white; ctx.textBaseline = 'alphabetic';
  ctx.textAlign = o.al || 'left';
  if (o.al === 'center') x += ls / 2; else if (o.al === 'right') x += ls;
  ctx.globalAlpha *= (o.a ?? 1);
  if (o.glow) { ctx.shadowColor = `rgba(${COL.blueRGB},${o.glow})`; ctx.shadowBlur = 18; }
  ctx.fillText(s, x, y); ctx.restore();
}
function tw(s, o) { ctx.save(); ctx.font = `${o.w || 400} ${o.s}px ${o.f || F.body}`; ctx.letterSpacing = (o.ls || 0) + 'px';
  const w = ctx.measureText(s).width - (o.ls || 0); ctx.restore(); return w; }
// masked reveal: the line rises into place from behind an invisible edge
function reveal(t, t0, dur, s, x, y, o) {
  const e = eexpo(P(t, t0, t0 + dur)); if (e <= 0) return;
  const h = o.s * 1.35;
  ctx.save(); ctx.beginPath(); ctx.rect(-20, y - o.s * 1.08, W + 40, h); ctx.clip();
  txt(s, x, y + (1 - e) * h * 0.9, { ...o, a: (o.a ?? 1) * clamp(e * 1.4) }); ctx.restore();
}
// per-letter masked reveal (centre aligned), used for the name
function revealLetters(t, t0, stagger, dur, s, cx, y, o) {
  ctx.save(); ctx.font = `${o.w} ${o.s}px ${o.f}`; ctx.letterSpacing = '0px';
  const ws = [...s].map(ch => ctx.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + o.ls * (s.length - 1);
  let x = cx - total / 2; const h = o.s * 1.3;
  ctx.beginPath(); ctx.rect(0, y - o.s * 1.05, W, h); ctx.clip();
  [...s].forEach((ch, i) => {
    const e = eexpo(P(t, t0 + i * stagger, t0 + i * stagger + dur));
    if (e > 0) { ctx.globalAlpha = (o.a ?? 1) * clamp(e * 1.5); ctx.fillStyle = o.c || COL.white;
      ctx.textAlign = 'left'; ctx.fillText(ch, x, y + (1 - e) * h * 0.85); }
    x += ws[i] + o.ls;
  });
  ctx.restore(); return total;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function line(x1, y1, x2, y2, c, lw) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.stroke(); }
function glowDot(x, y, r, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
  g.addColorStop(0, `rgba(210,235,255,${a})`); g.addColorStop(.18, `rgba(${COL.blueRGB},${a * .7})`);
  g.addColorStop(1, `rgba(${COL.blueRGB},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 6, 0, 7); ctx.fill();
}
function corners(x, y, w, h, len, a) { // HUD corner ticks
  ctx.save(); ctx.strokeStyle = `rgba(${COL.blueRGB},${a})`; ctx.lineWidth = 1.6; ctx.beginPath();
  [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([px, py, sx, sy]) => {
    ctx.moveTo(px, py + sy * len); ctx.lineTo(px, py); ctx.lineTo(px + sx * len, py); });
  ctx.stroke(); ctx.restore();
}
function strokeProgress(pathFn, len, prog, style, lw) {
  ctx.save(); ctx.setLineDash([len * prog, len + 10]); pathFn(); ctx.strokeStyle = style; ctx.lineWidth = lw; ctx.stroke(); ctx.restore();
}
function panelBox(x, y, w, h, a, prog) {
  ctx.save(); ctx.globalAlpha *= a;
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, 'rgba(18,38,84,0.62)'); g.addColorStop(1, 'rgba(8,18,44,0.55)');
  rr(x, y, w, h, 14); ctx.fillStyle = g; ctx.fill();
  strokeProgress(() => rr(x, y, w, h, 14), 2 * (w + h), prog, 'rgba(140,185,255,0.30)', 1.2);
  corners(x - 8, y - 8, w + 16, h + 16, 16, 0.55 * prog);
  ctx.restore();
}
function pathPoint(pts, u) { // point at fraction u along a polyline
  let L = 0; const seg = [];
  for (let i = 0; i < pts.length - 1; i++) { const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(d); L += d; }
  let d = u * L;
  for (let i = 0; i < seg.length; i++) { if (d <= seg[i] || i === seg.length - 1) { const k = clamp(d / seg[i]);
    return [lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)]; } d -= seg[i]; }
}
function bez(p0, p1, p2, u) { const v = 1 - u; return [v * v * p0[0] + 2 * v * u * p1[0] + u * u * p2[0], v * v * p0[1] + 2 * v * u * p1[1] + u * u * p2[1]]; }

// ---------- background: near-black navy, a sparse 3D network, grain ----------
const NET = (() => {
  const r = mulberry32(11), pts = [], pairs = [];
  for (let i = 0; i < 190; i++) pts.push({ x: (r() * 2 - 1) * 1.9, y: (r() * 2 - 1) * 1.05, z: 0.55 + r() * 2.6, ph: r() * 6.283 });
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const a = pts[i], b = pts[j]; if (Math.hypot(a.x - b.x, a.y - b.y, (a.z - b.z) * 0.8) < 0.36) pairs.push([i, j]); }
  return { pts, pairs };
})();
const CAM = [[0, 0, 0, -0.15], [5, 0.04, 0, 0.12], [18.4, -0.12, 0.02, 0.24], [33.5, 0.18, 0, 0.30], [46.3, -0.16, 0.02, 0.36],
  [58.8, 0, 0, 0.42], [69.3, 0.1, 0, 0.55], [79.5, -0.05, 0, 0.52], [90, 0, 0, 0.62]];
const NETI = [[0, 1], [4.3, 1], [5.6, .38], [18, .38], [19, .75], [46, .75], [47.2, .32], [58.6, .32], [59.6, .95], [69, .95],
  [70.2, .30], [79.3, .30], [80.5, .5], [90, .5]];
let GRAIN = [];
function makeGrain() {
  const r = mulberry32(3);
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = 960; c.height = 540; const g = c.getContext('2d');
    const d = g.createImageData(960, 540);
    for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0); GRAIN.push(c);
  }
}
function background(t, reveal = 1e9) {
  const g = ctx.createRadialGradient(960, 520, 80, 960, 540, 1250);
  g.addColorStop(0, '#0a1836'); g.addColorStop(.55, '#050c1f'); g.addColorStop(1, COL.bg0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const [cx, cy, cz] = keys(t, CAM); const I = keys(t, NETI)[0];
  const proj = NET.pts.map(p => {
    const z = p.z - cz; if (z < 0.12) return null;
    const f = 1 / z, dx = 0.025 * Math.sin(t * 0.21 + p.ph), dy = 0.02 * Math.cos(t * 0.17 + p.ph * 1.3);
    const x = 960 + (p.x + dx - cx) * f * 820, y = 540 + (p.y + dy - cy) * f * 820;
    const near = ss(0.12, 0.55, z), far = clamp(1.25 / (z + 0.4));
    const rv = ss(reveal + 40, reveal - 220, x);
    return { x, y, f, a: near * far * rv };
  });
  ctx.lineCap = 'round';
  for (const [i, j] of NET.pairs) {
    const a = proj[i], b = proj[j]; if (!a || !b) continue;
    const al = Math.min(a.a, b.a) * 0.22 * I; if (al < 0.004) continue;
    line(a.x, a.y, b.x, b.y, `rgba(${COL.blueRGB},${al})`, 0.5 + 0.35 * Math.min(a.f, 2));
  }
  for (const p of proj) { if (!p || p.a * I < 0.01) continue;
    ctx.fillStyle = `rgba(150,200,255,${p.a * 0.55 * I})`; ctx.beginPath(); ctx.arc(p.x, p.y, 0.8 + 0.9 * Math.min(p.f, 2.2), 0, 7); ctx.fill(); }
}
function finish(t) {
  const v = ctx.createRadialGradient(960, 540, 420, 960, 540, 1150);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.07;
  ctx.drawImage(GRAIN[Math.floor(t * 30) % GRAIN.length], 0, 0, W, H); ctx.restore();
}

// ---------- presenter (the supplied photograph, cut out and lit into the set) ----------
function presenter(t, cx, top, h, a, opts = {}) {
  if (a <= 0) return;
  const br = Math.sin(t * 2 * Math.PI / 5.2); // slow breath: ~1 px, never a fake gesture
  const y = top + br * 1.4, hh = h * (1 + br * 0.0015);
  ctx.save();
  // soft blue key behind the head
  const hx = cx + h * 0.02, hy = top + h * 0.33;
  const g = ctx.createRadialGradient(hx, hy, 10, hx, hy, h * 0.75);
  g.addColorStop(0, `rgba(40,110,230,${0.32 * a})`); g.addColorStop(.5, `rgba(20,60,150,${0.12 * a})`); g.addColorStop(1, 'rgba(10,30,80,0)');
  ctx.fillStyle = g; ctx.fillRect(hx - h, hy - h, 2 * h, 2 * h);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a * (opts.rim ?? 0.5);
  ctx.drawImage(A.glow, cx - hh * 0.515, y - hh * 0.02, hh * 1.03, hh * 1.03);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a;
  ctx.drawImage(A.pres, cx - hh / 2, y, hh, hh);
  // (the suit falling into shadow is baked into presenter.png)
  ctx.restore();
}

// ---------- icons (simple strokes, no fake UI) ----------
function icon(kind, x, y, s, a) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 64, s / 64); ctx.globalAlpha *= a;
  ctx.strokeStyle = COL.ice; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  switch (kind) {
    case 'need': ctx.arc(0, 0, 26, 0, 7); ctx.moveTo(13, 0); ctx.arc(0, 0, 13, 0, 7); ctx.moveTo(-34, 0); ctx.lineTo(-20, 0);
      ctx.moveTo(20, 0); ctx.lineTo(34, 0); ctx.moveTo(0, -34); ctx.lineTo(0, -20); ctx.moveTo(0, 20); ctx.lineTo(0, 34); break;
    case 'strategy': ctx.moveTo(-26, 22); ctx.lineTo(-6, 4); ctx.lineTo(8, 14); ctx.lineTo(26, -14); ctx.moveTo(26, -14); ctx.lineTo(26, -32);
      ctx.lineTo(40, -26); ctx.lineTo(26, -20); ctx.stroke(); ctx.beginPath();
      [[-26, 22], [-6, 4], [8, 14]].forEach(([px, py]) => { ctx.moveTo(px + 4.5, py); ctx.arc(px, py, 4.5, 0, 7); }); break;
    case 'build': ctx.rect(-28, 4, 24, 24); ctx.rect(4, 4, 24, 24); ctx.rect(-12, -26, 24, 24); break;
    case 'request': ctx.roundRect(-26, -20, 52, 34, 8); ctx.moveTo(-10, 14); ctx.lineTo(-16, 26); ctx.lineTo(2, 14);
      ctx.moveTo(-14, -5); ctx.lineTo(14, -5); ctx.moveTo(-14, 4); ctx.lineTo(6, 4); break;
    case 'assistant': for (let i = 0; i < 6; i++) { const an = Math.PI / 3 * i + Math.PI / 6; i ? ctx.lineTo(28 * Math.cos(an), 28 * Math.sin(an)) : ctx.moveTo(28 * Math.cos(an), 28 * Math.sin(an)); }
      ctx.closePath(); ctx.moveTo(0, -12); ctx.lineTo(3, -3); ctx.lineTo(12, 0); ctx.lineTo(3, 3); ctx.lineTo(0, 12); ctx.lineTo(-3, 3); ctx.lineTo(-12, 0); ctx.lineTo(-3, -3); ctx.closePath(); break;
    case 'tools': ctx.roundRect(-30, -12, 24, 24, 5); ctx.roundRect(6, -12, 24, 24, 5); ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
      ctx.moveTo(-18, -12); ctx.lineTo(-18, -24); ctx.lineTo(18, -24); ctx.lineTo(18, -12); break;
    case 'review': ctx.arc(0, 0, 26, 0, 7); ctx.moveTo(-12, 1); ctx.lineTo(-3, 10); ctx.lineTo(14, -9); break;
  }
  ctx.stroke(); ctx.restore();
}

// ---------- SCENES ----------
function scene1(t) { // 0–5 brand opening
  const head = lerp(-250, 2250, eio(P(t, 0.25, 2.5)));
  background(t, head);
  // the travelling light
  const la = (1 - ss(2.3, 3.4, t)) * ss(0.15, 0.4, t);
  if (la > 0) {
    const y = 540 + (head - 960) * -0.035;
    const g = ctx.createLinearGradient(head - 900, 0, head, 0);
    g.addColorStop(0, `rgba(${COL.blueRGB},0)`); g.addColorStop(.85, `rgba(${COL.blueRGB},${0.5 * la})`); g.addColorStop(1, `rgba(220,240,255,${0.95 * la})`);
    ctx.save(); ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(head - 900, y + 900 * 0.035); ctx.lineTo(head, y); ctx.stroke(); ctx.restore();
    glowDot(head, y, 5, 0.9 * la);
  }
  const out = 1 - ss(4.55, 5.15, t), drift = -14 * ss(4.4, 5.2, t);
  ctx.save(); ctx.globalAlpha = out; ctx.translate(0, drift);
  revealLetters(t, 1.15, 0.045, 0.9, 'ESTEVAO TATI M', 960, 520, { f: F.disp, w: 600, s: 92, ls: 18 });
  const lw = 560 * eio(P(t, 1.75, 2.6));
  if (lw > 0) { const lg = ctx.createLinearGradient(960 - lw / 2, 0, 960 + lw / 2, 0);
    lg.addColorStop(0, `rgba(${COL.blueRGB},0)`); lg.addColorStop(.5, `rgba(${COL.blueRGB},0.9)`); lg.addColorStop(1, `rgba(${COL.blueRGB},0)`);
    ctx.fillStyle = lg; ctx.fillRect(960 - lw / 2, 566, lw, 1.5); }
  reveal(t, 2.05, 0.9, 'AI Consultant  •  AI OS Founder', 960, 628, { f: F.body, w: 400, s: 36, ls: 3, c: COL.soft, al: 'center' });
  ctx.restore();
  ctx.fillStyle = `rgba(0,0,0,${1 - ss(0, 0.5, t)})`; ctx.fillRect(0, 0, W, H);
}

function lowerThird(t, t0, t1) {
  const e = eexpo(P(t, t0, t0 + 0.9)), o = 1 - ss(t1 - 0.4, t1 + 0.2, t); if (e <= 0 || o <= 0) return;
  ctx.save(); ctx.globalAlpha = o;
  const x = 150, y = 650;
  ctx.fillStyle = COL.blue; ctx.fillRect(x, y + 4, 3, 92 * e);
  reveal(t, t0 + 0.15, 0.8, 'ESTEVAO TATI M', x + 26, y + 44, { f: F.disp, w: 600, s: 36, ls: 6 });
  reveal(t, t0 + 0.32, 0.8, 'AI Consultant  •  AI OS Founder', x + 26, y + 86, { f: F.body, w: 400, s: 23, ls: 1.5, c: COL.soft });
  ctx.restore();
}

function scene2(t) { // personal introduction
  const [s, e] = S.s2;
  const inn = eout(P(t, s - 0.1, s + 1.3)), out = eio(P(t, e - 0.7, e + 0.4));
  const push = 1 + 0.07 * eio(P(t, s, e));
  const a = inn * (1 - out);
  ctx.save(); ctx.translate(-380 * out, 0);
  // push-in anchored on the face
  ctx.translate(1180, 400); ctx.scale(push * lerp(1.035, 1, inn), push * lerp(1.035, 1, inn)); ctx.translate(-1180, -400);
  presenter(t, 1180, 70, 1040, a, { rim: 0.22 });
  ctx.restore();
  ctx.save(); ctx.globalAlpha = 1 - out; lowerThird(t, s + 1.1, s + 8.6); ctx.restore();
}

const PANELS = [['01', 'need', 'UNDERSTAND', 'THE NEED'], ['02', 'strategy', 'DEFINE', 'THE STRATEGY'], ['03', 'build', 'BUILD', 'THE SOLUTION']];
function scene3(t) { // consulting and direction
  const [s, e] = S.s3;
  const inn = eout(P(t, s - 0.4, s + 1.0)), out = eio(P(t, e - 0.6, e + 0.35));
  const pan = lerp(70, -70, eio(P(t, s, e)));
  ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(pan + 340 * (1 - inn) - 260 * out, 0);
  reveal(t, s + 0.2, 0.9, 'FROM NEED TO SOLUTION', 960, 214, { f: F.mono, w: 500, s: 17, ls: 7, c: COL.blue, al: 'center' });
  const T = [cue('s3', 0) + 0.1, cue('s3', 1) + 0.35, cue('s3', 3) + 0.25];
  const pw = 450, ph = 330, py = 300, xs = [190, 735, 1280];
  // the connecting line, drawn as each panel arrives
  const ly = py + ph / 2;
  const d1 = eio(P(t, T[1] - 0.2, T[1] + 0.6)), d2 = eio(P(t, T[2] - 0.2, T[2] + 0.6));
  const x0 = xs[0] + pw, x1 = xs[1], x2 = xs[1] + pw, x3 = xs[2];
  if (d1 > 0) line(x0, ly, lerp(x0, x1, d1), ly, `rgba(${COL.blueRGB},0.7)`, 1.4);
  if (d2 > 0) line(x2, ly, lerp(x2, x3, d2), ly, `rgba(${COL.blueRGB},0.7)`, 1.4);
  // light travelling along the line once connected
  if (d2 >= 1 || d1 >= 1) {
    const span = d2 >= 1 ? [[x0, ly], [x1, ly], [x2, ly], [x3, ly]] : [[x0, ly], [x1, ly]];
    const u = ((t - T[1]) * 0.45) % 1;
    const gaps = d2 >= 1 ? [[x0, x1], [x2, x3]] : [[x0, x1]];
    const tot = gaps.reduce((a, [p, q]) => a + q - p, 0); let d = u * tot;
    for (const [p, q] of gaps) { if (d <= q - p) { glowDot(p + d, ly, 2.4, 0.85); break; } d -= q - p; }
  }
  PANELS.forEach(([n, ic, l1, l2], i) => {
    const pe = eout(P(t, T[i], T[i] + 0.9)); if (pe <= 0) return;
    const x = xs[i], y = py + 26 * (1 - pe);
    panelBox(x, y, pw, ph, pe, eio(P(t, T[i], T[i] + 1.1)));
    ctx.save(); ctx.globalAlpha *= pe;
    txt(n, x + 34, y + 54, { f: F.mono, w: 500, s: 18, ls: 3, c: COL.blue });
    icon(ic, x + pw - 70, y + 70, 54, 1);
    ctx.restore();
    reveal(t, T[i] + 0.2, 0.8, l1, x + 34, y + 222, { f: F.body, w: 600, s: 40, ls: 3 });
    reveal(t, T[i] + 0.32, 0.8, l2, x + 34, y + 272, { f: F.body, w: 400, s: 34, ls: 3, c: COL.soft });
  });
  ctx.restore();
}

const NODES = [['REQUEST', 'request'], ['AI ASSISTANT', 'assistant'], ['CONNECTED TOOLS', 'tools'], ['REVIEW', 'review']];
function scene4(t) { // agents, LLMs, automation — an illustrative workflow
  const [s, e] = S.s4;
  const inn = eout(P(t, s - 0.4, s + 1.0)), out = eio(P(t, e - 0.6, e + 0.35));
  ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(300 * (1 - inn) - 240 * out + lerp(30, -30, eio(P(t, s, e))), 0);

// ---------- compositor ----------
function frame(t) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (t < S.s2[0] + 0.3) scene1(t); else background(t);
  const on = k => t > S[k][0] - 1.0 && t < S[k][1] + 0.6;
  if (on('s2')) scene2(t);
  if (on('s3')) scene3(t);
  if (on('s4')) scene4(t);
  if (on('s5')) scene5(t);
  if (on('s6')) scene6(t);
  if (on('s7')) scene7(t);
  if (t > S.s8[0] - 1.0) scene8(t);
  finish(t);
}

// sound-design cue sheet, derived from the same timing the picture uses
function buildEvents() {
  const E = [];
  const add = (t, kind, gain = 1) => E.push({ t: +t.toFixed(3), kind, gain });
  add(0.0, 'riser'); add(1.15, 'accent', 1); add(2.1, 'tick', 0.5);
  for (const k of ['s2', 's3', 's4', 's5', 's6', 's7', 's8']) add(S[k][0] - 0.35, 'whoosh', k === 's2' ? 0.6 : 0.85);
  const T3 = [cue('s3', 0) + 0.1, cue('s3', 1) + 0.35, cue('s3', 3) + 0.25]; T3.forEach(x => add(x + 0.55, 'tick', 0.8));
  [0, 1, 2, 3].forEach(i => add(S.s4[0] + 0.35 + i * 0.28 + 0.4, 'tick', 0.45));
  [cue('s4', 0) + 0.6, cue('s4', 1) + 0.2, cue('s4', 2) + 0.15].forEach(x => add(x + 0.1, 'tick', 0.7));
  const c0 = cue('s5', 0); [c0 + 2.0, c0 + 3.3, c0 + 4.5].forEach(x => add(x + 0.1, 'tick', 0.6));
  add(S.s6[0] + 0.55, 'accent', 1.2); add(S.s6[0] + 0.55, 'lift', 1);
  add(S.s8[0] + 0.25, 'accent', 0.8);
  return E;
}
