# Netlify configuration — MWINDA DIGITAL
# Static site, no build step required.

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (chat proxy). Requires ANTHROPIC_API_KEY set in the
# Netlify UI (Site settings → Environment variables). Optional: CHAT_MODEL,
# CHAT_ENABLED=false as a kill switch.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Private content bundled with the key-gated console function: the OS page
  # fragment (kernel/agents/routines/memory/status) and the Monday briefs.
  # These are never published as static files — /docs/* returns 404.
  # data/reference/*.json is the country/source registry the BI engine grounds
  # its dossiers on. It is bundled, not published: /data/* returns 404 too.
  included_files = ["docs/briefs/*.md", "docs/os-console.html", "data/reference/*.json"]

# Pretty URL: serve preview.html-style content from the homepage if you ever
# want it; default is index.html. Kept here as a reference, commented out.
# [[redirects]]
#   from = "/preview"
#   to = "/preview.html"
#   status = 200

# ---------------------------------------------------------------------------
# HOLY MOUNTAIN WASHINGTON CHURCH — /holy-mountain/
# Placed above the block rules and the catch-all so the proxy and the short
# link are matched before /* falls through to index.html.
# ---------------------------------------------------------------------------

# The animated emblem clip, proxied from our own domain so the browser never
# contacts a third-party host (which media-src 'self' would refuse anyway).
# force = false: if the file is committed locally it wins over the proxy.
[[redirects]]
  from = "/holy-mountain/assets/clips/msw-logo-8s.mp4"
  to = "https://d8j0ntlcm91z4.cloudfront.net/user_3G9osobYr0aAENArzSDrqEFJFgW/hf_20260905_014712_4f0fe8f8-d359-462a-9690-67b6311b9e39.mp4"
  status = 200
  force = false

[[redirects]]
  from = "/church"
  to = "/holy-mountain/"
  status = 301

# ----- Block internal repository files (defence in depth) -----
# netlify.toml redirects are evaluated before _redirects, so these forced
# rules win over the static files sitting in the published root. The same
# rules are mirrored in _redirects for CLI/Drop deploys.
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOY-NETLIFY.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/mwinda-netlify.zip"
  to = "/index.html"
  status = 404
  force = true

# A missing asset must 404 rather than fall through to the catch-all below.
# Without this, a file that is mistyped or not yet committed answers with the
# whole of index.html at status 200: the browser downloads the entire homepage
# on every visit while trying to decode it as a video or an image, and the
# failure is invisible because the request looks successful.
#
# force = false on purpose — the rule applies only when no real file matches,
# so existing assets are still served.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404
  force = false

# 404 fallback (optional; the site is single-page anchors so usually unused)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ----- Security & performance headers -----
[[headers]]
  for = "/*"
  [headers.values]
    # Cross-origin framing is blocked everywhere (clickjacking); same-origin
    # framing stays allowed because demo.html previews the site in iframes.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    # Generated by scripts/update-csp.mjs — inline scripts are allowed by
    # SHA-256 hash, not 'unsafe-inline'. Re-run that script after editing any
    # inline <script>, or the browser will block it.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-3JWlDrSLLWaFP3TthVS5eS/5g1nZy86Rd6n+aEWhw08=' 'sha256-DfLRmeeChCRCzVFzMDspgPfHkMNFhRArA1IkSpeOOPI=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'self'; frame-src 'self'; base-uri 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests;" # csp:default

# The OS console carries the founder-key input: nothing may frame it, ever.
[[headers]]
  for = "/os"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-3JWlDrSLLWaFP3TthVS5eS/5g1nZy86Rd6n+aEWhw08=' 'sha256-DfLRmeeChCRCzVFzMDspgPfHkMNFhRArA1IkSpeOOPI=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'; frame-src 'self'; base-uri 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests;" # csp:strict

[[headers]]
  for = "/os.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-3JWlDrSLLWaFP3TthVS5eS/5g1nZy86Rd6n+aEWhw08=' 'sha256-DfLRmeeChCRCzVFzMDspgPfHkMNFhRArA1IkSpeOOPI=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'; frame-src 'self'; base-uri 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests;" # csp:strict

# Never cache the key-gated endpoints or their responses.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Cache static assets aggressively
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ----- Holy Mountain church site -----
# Stricter than the site-wide policy above, and deliberately NOT tagged
# csp:default / csp:strict: scripts/update-csp.mjs must not overwrite it with
# the Mwinda policy. This folder has no inline script and no style attribute,
# so it needs neither a hash nor 'unsafe-inline' — keep it that way.
# Both policies are sent for these paths and a browser enforces each one, so
# the effective rules are the intersection: the tightest always wins.
# X-Frame-Options is not repeated here; frame-ancestors 'none' covers it
# without emitting a header that contradicts the site-wide SAMEORIGIN.
[[headers]]
  for = "/holy-mountain/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/holy-mountain/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/holy-mountain/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
