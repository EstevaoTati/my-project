# Landing page — AI Consultant & Agentic Operating Systems.
# Site statique, aucun build.
[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# VIDÉO DE FOND — servie depuis VOTRE domaine.
# Netlify va chercher le clip 3D généré sur Higgsfield et le renvoie en
# même origine : le navigateur ne contacte aucun serveur externe.
# force = false → si vous déposez assets/clips/bg-tech.mp4 dans le dossier,
# c'est ce fichier local qui est servi (voir fetch-video.sh).
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/assets/clips/bg-tech.mp4"
  to = "https://d8j0ntlcm91z4.cloudfront.net/user_3G9osobYr0aAENArzSDrqEFJFgW/hf_20260730_005955_b7dfa171-e171-4ecd-8108-44f7dc4af7a8.mp4"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Tout est auto-hébergé : GSAP, polices woff2 en base64, et la vidéo
    # passe par le proxy ci-dessus. media-src garde le CDN en secours.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; connect-src 'self'; frame-ancestors 'self';"

# ---------------------------------------------------------------------------
# HOLY MOUNTAIN WASHINGTON CHURCH (/holy-mountain/)
# Animated logo clip generated on Higgsfield, proxied from our own domain so
# the browser never contacts an external host. force = false → if the file is
# committed locally (see holy-mountain/fetch-video.sh) the local copy wins.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/holy-mountain/assets/clips/msw-logo-8s.mp4"
  to = "https://d8j0ntlcm91z4.cloudfront.net/user_3G9osobYr0aAENArzSDrqEFJFgW/hf_20260905_014712_4f0fe8f8-d359-462a-9690-67b6311b9e39.mp4"
  status = 200
  force = false

[[redirects]]
  from = "/church"
  to = "/holy-mountain/"
  status = 301

# ---------------------------------------------------------------------------
# HOLY MOUNTAIN — security headers.
# Stricter than the site-wide policy above. Both are sent for these paths and
# a browser enforces every policy it receives, so the effective rules are the
# intersection: the tightest of the two always wins.
#
# script-src carries no 'unsafe-inline'. The page has exactly one inline
# script, the JSON-LD block, allowed by its sha256 hash. If you edit that
# block, run ./holy-mountain/tools/csp-hash.sh and paste the new line here,
# or the structured data stops working.
#
# style-src carries no 'unsafe-inline' either. The page has no style
# attributes; every rule lives in assets/css/site.css. Keep it that way.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/holy-mountain/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-bJkOdHqaBqrodh46l7Xpn2sRcJs3Nzm8Rgmhl0tyhIw='; style-src 'self'; img-src 'self' data:; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; font-src 'self'; connect-src 'self'; form-action 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(self), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/holy-mountain/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
