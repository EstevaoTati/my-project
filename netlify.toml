# Estevao Tati — AI Consultant & Agentic Operating Systems (landing page).
#
# This file configures ONE site: the landing page, published from
# `estevao-tati-site/` and nothing else. Static, no build.
#
# 242Konnect is a separate product with its own Netlify site. It is NOT served
# from here: its app is published from `242konnect-web/` (base directory
# `242konnect-web`, which carries its own netlify.toml), and its drag-and-drop
# package is `242konnect-netlify-package.zip`. See 242konnect-app/DEPLOY.md.
#
# Publishing the repository root used to put every 242Konnect folder — the app
# build, the prototype, the API source, the database migrations, even the zip —
# under this domain. Keep `publish` pointed at the site folder.

[build]
  publish = "estevao-tati-site"
  command = ""

# ---------------------------------------------------------------------------
# VIDÉO DE FOND — servie depuis VOTRE domaine.
# Netlify va chercher le clip 3D généré sur Higgsfield et le renvoie en
# même origine : le navigateur ne contacte aucun serveur externe.
# force = false → si vous déposez estevao-tati-site/assets/clips/bg-tech.mp4,
# c'est ce fichier local qui est servi (voir fetch-video.sh).
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/assets/clips/bg-tech.mp4"
  to = "https://d8j0ntlcm91z4.cloudfront.net/user_3G9osobYr0aAENArzSDrqEFJFgW/hf_20260730_005955_b7dfa171-e171-4ecd-8108-44f7dc4af7a8.mp4"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Tout est auto-hébergé : GSAP, polices woff2 en base64, et la vidéo
    # passe par le proxy ci-dessus. media-src garde le CDN en secours.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; connect-src 'self'; frame-ancestors 'self';"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
