# Netlify configuration — MWINDA DIGITAL
# Static site, no build step required.

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"

# Serverless functions (chat proxy). Requires ANTHROPIC_API_KEY set in the
# Netlify UI (Site settings → Environment variables). Optional: CHAT_MODEL,
# CHAT_ENABLED=false as a kill switch.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Monday briefs are bundled with the brief function (key-gated endpoint).
  included_files = ["docs/briefs/*.md"]

# Pretty URL: serve preview.html-style content from the homepage if you ever
# want it; default is index.html. Kept here as a reference, commented out.
# [[redirects]]
#   from = "/preview"
#   to = "/preview.html"
#   status = 200

# ----- Block internal repository files (defence in depth) -----
# netlify.toml redirects are evaluated before _redirects, so these forced
# rules win over the static files sitting in the published root. The same
# rules are mirrored in _redirects for CLI/Drop deploys.
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOY-NETLIFY.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/mwinda-netlify.zip"
  to = "/index.html"
  status = 404
  force = true

# 404 fallback (optional; the site is single-page anchors so usually unused)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ----- Security & performance headers -----
[[headers]]
  for = "/*"
  [headers.values]
    # Cross-origin framing is blocked everywhere (clickjacking); same-origin
    # framing stays allowed because demo.html previews the site in iframes.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    # Generated by scripts/update-csp.mjs — inline scripts are allowed by
    # SHA-256 hash, not 'unsafe-inline'. Re-run that script after editing any
    # inline <script>, or the browser will block it.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-3B7dQI8vO0VOheSsCtN1mkahG+AmmWvJtGtn65qxWq8=' 'sha256-DfLRmeeChCRCzVFzMDspgPfHkMNFhRArA1IkSpeOOPI=' 'sha256-VJ2gFfUQR5R8R26JZGV4eBvAmgkN0FPChZxD6H94t8c=' 'sha256-W1PJf+9mz17GE36EpDog5jsFme7D1RqjGMTUKEnHB5s=' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'self'; frame-src 'self'; base-uri 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests;" # csp:default

# The OS console carries the founder-key input: nothing may frame it, ever.
[[headers]]
  for = "/os"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-3B7dQI8vO0VOheSsCtN1mkahG+AmmWvJtGtn65qxWq8=' 'sha256-DfLRmeeChCRCzVFzMDspgPfHkMNFhRArA1IkSpeOOPI=' 'sha256-VJ2gFfUQR5R8R26JZGV4eBvAmgkN0FPChZxD6H94t8c=' 'sha256-W1PJf+9mz17GE36EpDog5jsFme7D1RqjGMTUKEnHB5s=' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'; frame-src 'self'; base-uri 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests;" # csp:strict

[[headers]]
  for = "/os.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-3B7dQI8vO0VOheSsCtN1mkahG+AmmWvJtGtn65qxWq8=' 'sha256-DfLRmeeChCRCzVFzMDspgPfHkMNFhRArA1IkSpeOOPI=' 'sha256-VJ2gFfUQR5R8R26JZGV4eBvAmgkN0FPChZxD6H94t8c=' 'sha256-W1PJf+9mz17GE36EpDog5jsFme7D1RqjGMTUKEnHB5s=' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'; frame-src 'self'; base-uri 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests;" # csp:strict

# Never cache the key-gated endpoints or their responses.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Cache static assets aggressively
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
