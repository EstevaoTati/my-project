# 242Konnect — the mobile app's web build, deployed as its own site.
#
# Generated by 242konnect-app/tools/build-web.js. Do not edit here; edit the
# script. Point a Netlify site's **base directory** at this folder and it
# serves the app at the site root.

[build]
  publish = "."
  command = ""
  # Explicit, and load-bearing rather than tidiness.
  #
  # This folder is a *published* directory: it holds the app bundle, a 1.3 MB
  # `_expo/static/js/web/index-*.js`. If Netlify's functions directory is left
  # pointing at this same folder — which is what the UI does by default once the
  # base directory is set, and what it was reported showing — Netlify tries to
  # bundle that React bundle as a serverless function and the deploy fails
  # before it ever publishes anything.
  #
  # netlify.toml wins over the UI setting, so naming a directory that does not
  # exist here is what stops that from happening. 242Konnect ships no functions;
  # its only server-side code is the Supabase Edge Function in supabase/functions,
  # which Supabase deploys, not Netlify.
  functions = "netlify/functions"

# Anything that is not a real file goes to the root — a redirect, not a
# rewrite. A `status = 200` rewrite would keep the requested URL, and the
# build's references are relative (`./_expo/…`) so that it works at any depth:
# at `/a/b` they would resolve under `/a/`, the browser would receive
# index.html where it expects JavaScript, and the page would be blank with no
# failed request to show for it. The app has no client-side routing, so there
# is no deep link worth preserving; revisit if that changes.
[[redirects]]
  from = "/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # connect-src names the one Supabase project the app uses for verification
    # codes, the profiles table and the PIN function. Without it sign-up fails
    # silently: the browser blocks the request, not the server, so nothing
    # reports it.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://abdmdtftnuyjzkdkcwiq.supabase.co; frame-ancestors 'self';"

# Fingerprinted, so they can be cached forever. index.html cannot.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
